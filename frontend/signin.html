<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — CineVault</title>
<meta name="description" content="Sign in or create an account to book seats.">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#09090f">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">

<script src="js/config.js"></script>
<script src="js/api.js"></script>
</head>
<body data-page="signin">

<a class="skip" href="#main">Skip to content</a>

<script src="js/layout.js"></script>

<main id="main" class="auth">
  <div class="auth__box">

    <div class="segs" id="authTabs" role="tablist" aria-label="Account">
      <button class="seg is-on" type="button" role="tab" aria-selected="true"  data-mode="in">Sign in</button>
      <button class="seg"       type="button" role="tab" aria-selected="false" data-mode="up">Register</button>
    </div>

    <h1 id="authTitle">Welcome back</h1>
    <p id="authSub">Sign in to book seats and see your reservations.</p>

    <form id="authForm" novalidate>

      <div class="field--row" id="nameRow" hidden>
        <div class="field">
          <label for="a-first">First name</label>
          <input type="text" id="a-first" name="first_name" autocomplete="given-name" placeholder="Alex">
        </div>
        <div class="field">
          <label for="a-last">Last name</label>
          <input type="text" id="a-last" name="last_name" autocomplete="family-name" placeholder="Brown">
        </div>
      </div>

      <div class="field">
        <label for="a-email">Email</label>
        <input type="email" id="a-email" name="email" autocomplete="email" placeholder="you@example.com" required>
      </div>

      <div class="field" id="codeField" hidden>
        <label for="a-code">Reset code</label>
        <input type="text" id="a-code" name="code" inputmode="numeric" placeholder="123456" maxlength="6">
      </div>

      <div class="field" id="passField">
        <label for="a-pass">Password</label>
        <input type="password" id="a-pass" name="password" autocomplete="current-password" placeholder="••••••••" required>
        <span class="field__hint" id="passHint"></span>
      </div>

      <div class="field" id="newPassField" hidden>
        <label for="a-newpass">New password</label>
        <input type="password" id="a-newpass" name="new_password" autocomplete="new-password" placeholder="••••••••">
      </div>

      <div class="field" id="confirmField" hidden>
        <label for="a-confirm">Confirm password</label>
        <input type="password" id="a-confirm" name="confirm_password" autocomplete="new-password" placeholder="••••••••">
      </div>

      <p class="msg" id="authError" hidden></p>

      <button class="btn btn--accent btn--lg btn--full" type="submit" id="authGo">
        <svg><use href="#i-user"/></svg><span id="authGoLabel">Sign in</span>
      </button>
    </form>

    <p class="auth__alt" id="authAlt">
      New to CineVault? <a href="#" data-go="up">Create an account</a>
    </p>

  </div>
</main>

<script src="js/main.js"></script>
<script src="js/auth.js"></script>
</body>
</html>
