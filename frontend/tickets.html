<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookings — CineVault</title>
<meta name="description" content="Every seat you have reserved, past and upcoming.">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#09090f">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">

<script src="js/config.js"></script>
<script src="js/api.js"></script>
</head>
<body data-page="tickets">

<a class="skip" href="#main">Skip to content</a>

<script src="js/layout.js"></script>

<main id="main">

<header class="phead">
  <div class="wrap">
    <nav class="crumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <svg><use href="#i-arrow"/></svg>
      <span>My bookings</span>
    </nav>
    <h1>My Bookings</h1>
    <p>Every reservation on your account — what is still to come, what you owe, and what has already played.</p>
  </div>
</header>

<section class="section">
  <div class="wrap">

    <div class="toolbar">
      <p class="toolbar__count" id="count">&nbsp;</p>
      <div class="toolbar__right">
        <div class="segs" id="filters" role="tablist" aria-label="Filter bookings">
          <button class="seg is-on" type="button" data-filter="all" role="tab">All</button>
          <button class="seg" type="button" data-filter="upcoming" role="tab">Upcoming</button>
          <button class="seg" type="button" data-filter="unpaid" role="tab">Awaiting payment</button>
          <button class="seg" type="button" data-filter="past" role="tab">Past</button>
        </div>
      </div>
    </div>

    <div id="bookings"></div>

    <div class="empty" id="empty">
      <svg><use href="#i-ticket"/></svg>
      <p>Nothing here yet. <a href="movies.html" style="color:var(--accent)">Pick a film</a> and your bookings will show up on this page.</p>
    </div>

  </div>
</section>

</main>

<script src="js/main.js"></script>
<script src="js/catalogue.js"></script>
<script src="js/tickets.js"></script>
</body>
</html>
