<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Halls — CineVault</title>
<meta name="description" content="Every auditorium, its capacity and what is scheduled in it.">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#09090f">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/pages.css">

<script src="js/config.js"></script>
<script src="js/api.js"></script>
</head>
<body data-page="cinemas">

<a class="skip" href="#main">Skip to content</a>

<script src="js/layout.js"></script>

<main id="main">

<header class="phead">
  <div class="wrap">
    <nav class="crumb" aria-label="Breadcrumb">
      <a href="index.html">Home</a>
      <svg><use href="#i-arrow"/></svg>
      <span>Halls</span>
    </nav>
    <h1>Our Halls</h1>
    <p>Every auditorium in the system, its seating plan, and what is scheduled to play in it.</p>
  </div>
</header>

<section class="section">
  <div class="wrap">

    <div class="toolbar">
      <p class="toolbar__count" id="count">&nbsp;</p>
      <div class="toolbar__right">
        <div class="search search--inline">
          <svg class="search__i"><use href="#i-search"/></svg>
          <input type="search" id="venueSearch" placeholder="Find a hall…" aria-label="Search halls">
        </div>
        <label class="sortsel">
          <svg><use href="#i-sort"/></svg>
          <select id="sort" aria-label="Sort halls">
            <option value="az">Name A – Z</option>
            <option value="capacity">Most seats</option>
            <option value="screenings">Most screenings</option>
            <option value="price">Lowest price</option>
          </select>
        </label>
      </div>
    </div>

    <div id="venues"></div>

    <div class="empty" id="empty">
      <svg><use href="#i-screen"/></svg>
      <p>No halls match that search.</p>
    </div>

  </div>
</section>

</main>

<script src="js/main.js"></script>
<script src="js/catalogue.js"></script>
<script src="js/cinemas.js"></script>
</body>
</html>
