# TLS ends at Caddy, so $scheme here is always http. Pass on the scheme
# Caddy reports instead, or Django sees every request as plain HTTP and
# SECURE_SSL_REDIRECT loops forever. Safe only because nginx publishes no
# port — Caddy is the sole client and overwrites whatever a browser sent.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

upstream django {
    server web:8000;
}

server {
    listen 80;
    server_name _;

    # Posters are the largest thing uploaded through the admin; nginx's
    # 1 MB default would reject most of them before Django ever sees it.
    client_max_body_size 20M;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # SECURE_PROXY_SSL_HEADER in settings.py trusts this. See the map above.
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_redirect off;

    # ── Django ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://django;
    }

    location /admin/ {
        proxy_pass http://django;
    }

    location /api-auth/ {
        proxy_pass http://django;
    }

    location /swagger/ {
        proxy_pass http://django;
    }

    # ── files Django owns but does not serve ───────────────────
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── the frontend ───────────────────────────────────────────
    # Same origin as everything above, which is what lets config.js use
    # relative paths and makes CORS irrelevant.

    # config.js and the stylesheets change on deploy and carry no hash in
    # their filename, so a long cache here would serve last week's API
    # base URL. Declared before `location /` because a regex match wins.
    location ~* ^/(js|css)/ {
        root /usr/share/nginx/html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;

        # The pages are real .html files, so a bare /movies resolves to
        # movies.html rather than 404ing.
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;
}
