# TLS ends at Caddy, so $scheme here is always http. Pass on the scheme
# Caddy reports instead, or Django sees every request as plain HTTP and
# SECURE_SSL_REDIRECT loops forever. Safe only because nginx publishes no
# port — Caddy is the sole client and overwrites whatever a browser sent.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}

# Docker's internal DNS. proxy_pass below goes through a variable, so nginx looks
# the container up while running instead of once at startup. A rebuilt app
# container gets a new IP; a fixed upstream block would keep the old one and
# answer 502 until nginx itself was restarted.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    set $django http://web:8000;

    # Posters are the largest thing uploaded through the admin; nginx's
    # 1 MB default would reject most of them before Django ever sees it.
    client_max_body_size 20M;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # SECURE_PROXY_SSL_HEADER in settings.py trusts this. See the map above.
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_redirect off;

    # ── Django ─────────────────────────────────────────────────
    location /api/ {
        proxy_pass $django;
    }

    location /admin/ {
        proxy_pass $django;
    }

    location /api-auth/ {
        proxy_pass $django;
    }

    location /swagger/ {
        proxy_pass $django;
    }

    # ── files Django owns but does not serve ───────────────────
    location /static/ {
        alias /app/staticfiles/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /app/media/;
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ── the frontend ───────────────────────────────────────────
    # Same origin as everything above, which is what lets config.js use
    # relative paths and makes CORS irrelevant.

    # Pages are linked as /movies, not /movies.html. Old links and search
    # results still use the file name, so send them to the clean URL with
    # the query string intact. This tests $request_uri — what the browser
    # actually asked for — because `index index.html` below rewrites / to
    # /index.html internally, and redirecting that would loop.
    #
    # Relative Location headers: TLS ends at Caddy, so an absolute one built
    # here would say http:// and cost the visitor an extra hop back to https.
    absolute_redirect off;

    if ($request_uri ~ ^/index\.html(\?.*)?$) {
        return 301 /$1;
    }
    if ($request_uri ~ ^/([a-z0-9_-]+)\.html(\?.*)?$) {
        return 301 /$1$2;
    }

    # config.js and the stylesheets change on deploy and carry no hash in
    # their filename, so a long cache here would serve last week's API
    # base URL. Declared before `location /` because a regex match wins.
    location ~* ^/(js|css)/ {
        root /usr/share/nginx/html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;

        # The pages are real .html files, so a bare /movies resolves to
        # movies.html rather than 404ing.
        try_files $uri $uri.html $uri/ =404;
    }

    # 404.html is the error page, not a page to visit: /404 answers 404 too.
    location = /404 {
        return 404;
    }

    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    server_tokens off;
}
